/* ==================== スコアボード ====================
   この範囲の数値は、画面上のスコアボードだけに影響します。 */
:root{
  --score-number-size:200px; /* 左右の大きな得点の文字サイズ */
  --score-box-min-width:120px; /* 左右の黒い得点ボックスの最小幅 */
  --score-box-min-height:200px; /* 左右の黒い得点ボックスの最小高さ */
}
/* 画面全体を覆う半透明の背景です。普段は非表示で、.is-open の時だけ表示します。 */
.scoreboard-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);display:none;align-items:center;justify-content:center;z-index:50}
.scoreboard-overlay.is-open{display:flex}
/* 白いスコアボード本体です。padding:24px は内側の余白、min-width:320px は最小幅です。 */
.scoreboard{background:#fff;border-radius:12px;padding:24px;min-width:320px;max-width:2000px;width:100%;box-shadow:0 24px 48px rgba(0,0,0,0.35);font-size:18px;position:relative}
/* 使っていない行用の基本レイアウトです。 */
.scoreboard .row{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
/* 選手名の間隔:12px、文字サイズ:20px です。 */
.scoreboard .names{display:flex;align-items:center;gap:12px;font-weight:800;font-size:40px;justify-content:center;width:100%}
/* 左右の得点とセット欄の間隔:20px、上下の余白:18px です。 */
.scoreboard .points{display:flex;gap:20px;align-items:center;justify-content:center;margin:18px 0}
/* 左右の黒い得点ボックスです。padding は数字の周囲、border-radius は角丸です。 */
.scoreboard .point{position:relative;background:#111;color:#ffd93b;padding:8px 22px;border-radius:8px;font-size:var(--score-number-size);line-height:1;min-width:var(--score-box-min-width);min-height:var(--score-box-min-height);display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none;box-shadow:inset 0 -6px 0 rgba(0,0,0,0.2)}
/* セット数は左右の得点ボックスの間に縦に表示します。 */
.scoreboard .sets{display:flex;flex-direction:column;align-items:center;gap:6px;justify-content:center}
/* 「セット」という文字です。font-size:16px は文字サイズです。 */
.scoreboard .set-label{font-size:16px;color:#888}
/* 左右のセット数を縦に並べる欄です。数字同士の間隔は6pxです。 */
.scoreboard .sets-between{display:flex;flex-direction:column;align-items:center;gap:6px}
/* セット数の薄赤い箱です。padding:8px 14px は上下左右の余白です。 */
.scoreboard .set{background:#fff0ec;padding:8px 14px;border-radius:8px;font-weight:800}
/* 確定・閉じるボタンの並びです。ボタン間隔は12px、上余白は18pxです。 */
.scoreboard .controls{display:flex;gap:12px;justify-content:center;margin-top:18px}
/* 選手入れ替えボタンです。画面幅に関係なく48px四方で固定し、文字を中央に置きます。 */
.scoreboard .swap-btn{background:#222;color:#fff;border:1px solid #222;padding:0;border-radius:12px;cursor:pointer;font-size:26px;line-height:1;width:100px;height:48px;min-width:48px;min-height:48px;box-sizing:border-box;display:flex;align-items:center;justify-content:center}
/* 右下の × ボタンです。全体用buttonのwidth:100%を上書きして画面中央へずれないようにします。 */
.scoreboard-overlay .close-x{background:transparent;border:none;font-size:26px;cursor:pointer;color:#888;position:fixed!important;left:auto!important;top:auto!important;bottom:5vh!important;right:5vw!important;width:80px!important;min-width:80px!important;height:80px!important;min-height:80px!important;padding:0!important;transform:none!important;z-index:100}
.scoreboard .control-main{display:flex;gap:12px}
/* ボタンの最小幅・内側余白・文字サイズです。 */
.scoreboard .control-main button{min-width:80px;padding:12px 18px;font-size:18px}
/* 画面幅に関係なく、常に同じレイアウトで表示するスコアボード */
/* 白い部分 */
  .scoreboard{
    position:fixed;

    left:0;
    top:0;

    width:100vw !important;
    height:100vh !important;

    max-width:none !important;
    max-height:none !important;

    padding:0;

    box-sizing:border-box;

    transform:none !important;

    overflow:hidden;
  }

  /* 中身だけ横向きにする */
  .scoreboard-content{
    width:100vh;
    height:100vw;

    box-sizing:border-box;

    position:absolute;
    left:50%;
    top:50%;

    transform:translate(-50%,-50%) rotate(90deg);
    transform-origin:center center;
  }

/* 得点：上下に配置。padding/gap を変えると左右の余白と得点間隔が変わります。 */
.scoreboard .points{
  width:100%;
  height:100%;

  display:flex;
  flex-direction:row;

  align-items:center;
  justify-content:space-between;

  padding:4%;
  box-sizing:border-box;

  gap:0;
}

.scoreboard .point{
  width: 30%;
  min-width: 200px;

  height: 85%;
  min-height:0;

  font-size:var(--score-number-size);

  padding-top:4vmin;
  padding-bottom:4vmin;

  border-radius:10px;
  box-sizing:border-box;

  display:flex;
  align-items:center;
  justify-content:center;
}

  /* セット：左側。width:14% はセット欄の横幅、margin-top:6vmin は上位置です。 */
.scoreboard .sets-between{
  width:24%;
  min-width:70px;

  margin:0 -180px;
  margin-bottom:-180px;

  display:flex;
  flex-direction:row;
  align-items:center;
  justify-content:center;

  gap:4px;
}

.scoreboard .set{
  padding:10px 50px;
  font-size:60px;
  box-sizing:border-box;
}

  /* リセット・確定：中央。left/top:50% は中央位置です。 */
  .scoreboard .controls{
    position:absolute;
    left:50%;
    top:30%;
    transform:translate(-50%,-50%);
    display:flex;
    flex-direction:column;
    gap:12px; /* 中央ボタン同士の間隔 */
    z-index:55;
  }

  .scoreboard .controls .ghost{
    border:3px solid #e63000; /* 中央ボタンの枠線の太さ */
    color:#e63000;
    background:transparent;
    padding:5px 30px; /* 中央ボタンの内側余白 */
    font-size:30px; /* 中央ボタンの文字サイズ */
    border-radius:8px; /* 中央ボタンの角丸 */
  }

  /* 名前：左右の得点ボックスの上側。得点欄と同じ3列に揃えます。 */
.scoreboard .names{
  position:absolute;
  left:4%; /* 得点欄の左側余白と同じ位置 */
  top:3%; /* 得点ボックスの上側に置く位置 */
  width:92%;
  display:grid;
  grid-template-columns:30% 34% 30%; /* 左得点・中央セット・右得点と同じ幅 */
  justify-content:space-between;
  align-items:center;
  gap:0;
}

  .scoreboard .names span{
    width:100%;
    grid-row:1;
    display:inline-block;
    border:2px solid #111; /* 名前箱の枠線の太さ */
    padding:10px 14px; /* 名前箱の内側余白 */
    background:#fff;
    border-radius:6px; /* 名前箱の角丸 */
    font-size:18px; /* 名前の文字サイズ */
    text-align:center;
  }

  .scoreboard .names span:first-child{grid-column:1}
  .scoreboard .names span:last-child{grid-column:3}

  /* 入れ替えボタンは左右の名前の間に置きます。 */
 .scoreboard .swap-btn{
  grid-column:2;
  grid-row:1;
  justify-self:center;
  margin:0;
}

  /* ×ボタン。bottom/right:5vh・5vw は画面端からの距離を割合で指定します。 */
  .scoreboard-overlay .close-x{
    left:auto!important;
    top:auto!important;
    bottom:5vh!important;
    right:5vw!important;
    width:80px!important;
    min-width:80px!important;
    height:80px!important;
    min-height:80px!important;
    padding:0!important;
    transform:none!important;
    font-size:80px;
    z-index:80;
  }

</style>

async function ensureMemberId(user){
  if(!user||user.isAnonymous)return '';
  const profileRef=doc(db,'users',user.uid);
  return runTransaction(db,async transaction=>{
    const profileSnapshot=await transaction.get(profileRef);
    const existingId=profileSnapshot.exists()?profileSnapshot.data().memberId:'';
    if(existingId)return existingId;
    for(let attempt=0;attempt<20;attempt++){
      const memberId=generateMemberId();
      const reservationRef=doc(db,'memberCodes',memberId);
      const reservation=await transaction.get(reservationRef);
      if(reservation.exists())continue;
      const now=Date.now();
      const displayName=user.displayName||profileSnapshot.data()?.displayName||'';
      transaction.set(reservationRef,{uid:user.uid,memberId,createdAt:now});
      transaction.set(profileRef,{uid:user.uid,memberId,displayName,displayNameLower:displayName.trim().toLowerCase(),updatedAt:now},{merge:true});
      return memberId;
    }
    throw new Error('会員IDを発行できませんでした。もう一度お試しください。');
  });
}

async function searchUserProfiles(searchText){
  const term=searchText.trim();
  if(!term||!canOrganize())return [];
  const usersById=new Map();
  if(term.length>=20){
    const exact=await getDoc(doc(db,'users',term));
    if(exact.exists())usersById.set(exact.id,exact.data());
  }
  const memberCode=term.toLowerCase();
  if(/^[a-hj-np-z2-9]{7}$/.test(memberCode)){
    const reservation=await getDoc(doc(db,'memberCodes',memberCode));
    if(reservation.exists()){
      const profile=await getDoc(doc(db,'users',reservation.data().uid));
      if(profile.exists())usersById.set(profile.id,profile.data());
    }
    const profileMatches=await getDocs(query(collection(db,'users'),where('memberId','==',memberCode),limit(10)));
    profileMatches.forEach(snapshot=>usersById.set(snapshot.id,snapshot.data()));
  }
  const prefix=term.toLocaleLowerCase();
  const results=await getDocs(query(
    collection(db,'users'),
    where('displayNameLower','>=',prefix),
    where('displayNameLower','<=',`${prefix}\uf8ff`),
    limit(10)
  ));
  results.forEach(snapshot=>usersById.set(snapshot.id,snapshot.data()));
  return [...usersById.values()].filter(profile=>profile.displayName||profile.memberId).slice(0,10);
}
async function loadMyParticipation(uid){
  myParticipationStatus='loading';
  myParticipation={matches:[],wins:0,losses:0,draws:0,setsWon:0,setsLost:0,rating:1500,ratingTier:'',initialRating:null,ratingHistory:[]};
  try{
    const [matchDocuments,profileSnapshot]=await Promise.all([
      getDocs(collection(db,'matches')),
      getDoc(doc(db,'users',uid))
    ]);
    const profile=profileSnapshot.exists()?profileSnapshot.data():{};
    const profileInitialRating=Number(profile.initialRating);
    const hasProfileRating=Number.isFinite(profileInitialRating);
    const participation={matches:[],wins:0,losses:0,draws:0,setsWon:0,setsLost:0,rating:hasProfileRating?profileInitialRating:1500,ratingTier:profile.ratingTier||'',initialRating:hasProfileRating?profileInitialRating:null,memberId:profile.memberId||'',ratingHistory:[]};
    const ratedEvents=[];
    matchDocuments.forEach(snapshot=>{
      const data=snapshot.data();
      let history=data.history||[];
      if(typeof history==='string'){
        try{history=JSON.parse(history);}catch(error){history=[];}
      }
      const userIdForName=name=>{
        const playerIndexes=(data.players||[]).reduce((indexes,player,index)=>{
          if(player===name)indexes.push(index);
          return indexes;
        },[]);
        return playerIndexes.length===1?(data.playerIds||[])[playerIndexes[0]]||'':'';
      };
      for(const result of history){
        const p1Uid=result.p1Uid||userIdForName(result.p1);
        const p2Uid=result.p2Uid||userIdForName(result.p2);
        if(result.deleted)continue;
        const isP1=p1Uid===uid;
        const scores=calcSets(result.sets||[]);
        if(p1Uid&&p2Uid){
          ratedEvents.push({matchId:snapshot.id,id:result.id||'',p1Uid,p2Uid,p1:result.p1,p2:result.p2,p1InitialRating:Number(result.p1InitialRating??data.playerInitialRatings?.[p1Uid]),p2InitialRating:Number(result.p2InitialRating??data.playerInitialRatings?.[p2Uid]),sets:scores,ts:Number(result.ts)||0,tableLabel:result.tableLabel||''});
        }
        if(p1Uid===uid||p2Uid===uid){
          const wonSets=isP1?scores.w1:scores.w2;
          const lostSets=isP1?scores.w2:scores.w1;
          const outcome=wonSets>lostSets?'win':wonSets<lostSets?'loss':'draw';
          participation[outcome==='win'?'wins':outcome==='loss'?'losses':'draws']++;
          participation.setsWon+=wonSets;
          participation.setsLost+=lostSets;
          participation.matches.push({
            matchId:snapshot.id,
            tableLabel:result.tableLabel||'',
            opponent:isP1?result.p2:result.p1,
            score:`${wonSets}-${lostSets}`,
            outcome,
            ts:Number(result.ts)||0,
            status:'完了'
          });
        }
      }
      for(const active of data.activeMatches||[]){
        const p1Uid=active.p1Uid||userIdForName(active.p1);
        const p2Uid=active.p2Uid||userIdForName(active.p2);
        if(p1Uid!==uid&&p2Uid!==uid)continue;
        participation.matches.push({
          matchId:snapshot.id,
          tableLabel:`台${Number(active.tableIdx)+1}`,
          opponent:p1Uid===uid?active.p2:active.p1,
          score:'',
          outcome:'pending',
          ts:0,
          status:'進行中'
        });
      }
    });
    ratedEvents.sort((a,b)=>a.ts-b.ts||a.matchId.localeCompare(b.matchId)||a.id.localeCompare(b.id));
    const firstUserEvent=ratedEvents.find(event=>event.p1Uid===uid||event.p2Uid===uid);
    const firstUserInitialRating=firstUserEvent?(firstUserEvent.p1Uid===uid?firstUserEvent.p1InitialRating:firstUserEvent.p2InitialRating):NaN;
    const startingRating=hasProfileRating?profileInitialRating:Number.isFinite(firstUserInitialRating)?firstUserInitialRating:1500;
    if(firstUserEvent)participation.ratingHistory.push({ts:Math.max(0,firstUserEvent.ts-1),rating:startingRating,change:0,opponent:'',matchId:'',outcome:'初期'});
    const ratings=new Map();
    const playedGames=new Map();
    const kForGames=games=>games<5?48:games<10?40:32;
    const initialRatingFor=(playerUid,event,side)=>{
      if(playerUid===uid&&hasProfileRating)return profileInitialRating;
      const snapshotRating=side==='p1'?event.p1InitialRating:event.p2InitialRating;
      return Number.isFinite(snapshotRating)?snapshotRating:1500;
    };
    for(const event of ratedEvents){
      const p1Rating=ratings.has(event.p1Uid)?ratings.get(event.p1Uid):initialRatingFor(event.p1Uid,event,'p1');
      const p2Rating=ratings.has(event.p2Uid)?ratings.get(event.p2Uid):initialRatingFor(event.p2Uid,event,'p2');
      const expectedP1=1/(1+10**((p2Rating-p1Rating)/200));
      const actualP1=event.sets.w1>event.sets.w2?1:event.sets.w1<event.sets.w2?0:0.5;
      const p1K=kForGames(playedGames.get(event.p1Uid)||0);
      const p2K=kForGames(playedGames.get(event.p2Uid)||0);
      const p1Change=p1K*(actualP1-expectedP1);
      const p2Change=p2K*((1-actualP1)-(1-expectedP1));
      ratings.set(event.p1Uid,p1Rating+p1Change);
      ratings.set(event.p2Uid,p2Rating+p2Change);
      playedGames.set(event.p1Uid,(playedGames.get(event.p1Uid)||0)+1);
      playedGames.set(event.p2Uid,(playedGames.get(event.p2Uid)||0)+1);
      if(event.p1Uid===uid||event.p2Uid===uid){
        const isP1=event.p1Uid===uid;
        const change=isP1?p1Change:p2Change;
        participation.ratingHistory.push({
          ts:event.ts,
          rating:isP1?p1Rating+p1Change:p2Rating+p2Change,
          change,
          opponent:isP1?event.p2:event.p1,
          matchId:event.matchId,
          outcome:change>0?'勝ち':change<0?'負け':'引き分け'
        });
      }
    }
    participation.rating=ratings.get(uid)??(hasProfileRating?profileInitialRating:Number.isFinite(firstUserInitialRating)?firstUserInitialRating:1500);
    participation.matches.sort((a,b)=>b.ts-a.ts);
    myParticipation=participation;
    currentUserRating=participation.rating;
    currentUserRatingTier=participation.ratingTier;
    currentUserInitialRating=participation.initialRating??NaN;
    myParticipationStatus='loaded';
  }catch(error){
    console.error('参加試合記録の取得に失敗しました',error);
    myParticipationStatus='error';
  }
}
  
  function findNestedArrays(obj, path = ''){
  if(Array.isArray(obj)){
    obj.forEach((item, i) => {
      if(Array.isArray(item)){
        console.log('★ ネストされた配列:', path + '[' + i + ']', item);
      }else if(item && typeof item === 'object'){
        findNestedArrays(item, path + '[' + i + ']');
      }
    });
  }else if(obj && typeof obj === 'object'){
    Object.entries(obj).forEach(([key, value]) => {
      findNestedArrays(value, path ? path + '.' + key : key);
    });
  }
}

function watchMatch(matchId){
  if(!/^\d{6}$/.test(matchId))return;
  onSnapshot(doc(db,'matches',matchId),snapshot=>{
    if(!snapshot.exists())return;
    const data=snapshot.data();
    if(typeof data.activeSets === 'string'){
      try{data.activeSets=JSON.parse(data.activeSets);}catch(error){console.error('activeSetsの復元に失敗しました',error);return;}
    }
    if(typeof data.history === 'string'){
      try{data.history=JSON.parse(data.history);}catch(error){console.error('historyの復元に失敗しました',error);return;}
    }
    if(typeof data.editingSets === 'string'){
      try{data.editingSets=JSON.parse(data.editingSets);}catch(error){console.error('editingSetsの復元に失敗しました',error);return;}
    }
    const remote=JSON.stringify(data);
    if(remote===JSON.stringify(S))return;
    if(SB.mid){
      const previousMatch=S.activeMatches.find(match=>match.id===SB.mid);
      const updatedMatch=Array.isArray(data.activeMatches)?data.activeMatches.find(match=>match.id===SB.mid):null;
      if(previousMatch&&(!updatedMatch||previousMatch.p1!==updatedMatch.p1||previousMatch.p2!==updatedMatch.p2))closeScoreboard();
    }
    applyingRemoteState=true;
    try{Object.assign(S,data);localStorage.setItem(matchStorageKey(matchId),remote);render();}
    finally{applyingRemoteState=false;}
  },error=>console.error('Firestoreの監視に失敗しました',error));
}
async function loadRemoteState(matchId){

    if(!snapshot.exists())return false;

    const data=snapshot.data();

    // Firestore保存時にJSON文字列にしたactiveSetsを元の配列に戻す
    if(typeof data.activeSets === 'string'){
      data.activeSets = JSON.parse(data.activeSets);
    }
    if(typeof data.history === 'string'){
      data.history = JSON.parse(data.history);
    }
    if(typeof data.editingSets === 'string'){
      data.editingSets = JSON.parse(data.editingSets);
    }

  Object.assign(S,data);

  localStorage.setItem(
    matchStorageKey(id),
    JSON.stringify(S)
  );

  localStorage.setItem(
    'tableLeagueLastMatch',
    id
  );

  return true;

  }catch(error){

    return false;
  }
}

function replaceActivePlayers(matchId){
  if(!adminUser){alert('管理者アカウントでログインしてください');return;}
  const match=S.activeMatches.find(item=>item.id===matchId);
  if(!match)return;
  const p1=[...document.querySelectorAll('[data-replace-p1]')].find(element=>element.dataset.replaceP1===matchId)?.value;
  const p2=[...document.querySelectorAll('[data-replace-p2]')].find(element=>element.dataset.replaceP2===matchId)?.value;
  if(!S.players.includes(p1)||!S.players.includes(p2)||p1===p2){alert('別々の参加者を選択してください');return;}
  if(isSamePair(match,p1,p2))return;
  const busy=S.activeMatches.filter(item=>item.id!==matchId).flatMap(item=>[item.p1,item.p2]);
  if(busy.includes(p1)||busy.includes(p2)){alert('選択した選手は別の試合に参加中です');return;}
  if(!confirm('選手を変更すると、この試合の点数・セット数をリセットし、変更前・変更後ペアの確定済み試合は削除扱いになります。変更しますか？'))return;
  if(SB.mid===matchId)closeScoreboard();
  const previousPair=[match.p1,match.p2];
  const previousPairUids=[match.p1Uid||'',match.p2Uid||''];
  const previousPairInitialRatings=[match.p1InitialRating??1500,match.p2InitialRating??1500];
  markPairHistoryDeleted(...previousPair);
  markPairHistoryDeleted(p1,p2);
  match.p1=p1;
  match.p2=p2;
  match.p1Uid=S.playerIds[S.players.indexOf(p1)]||'';
  match.p2Uid=S.playerIds[S.players.indexOf(p2)]||'';
  match.p1InitialRating=S.playerInitialRatings[match.p1Uid]??1500;
  match.p2InitialRating=S.playerInitialRatings[match.p2Uid]??1500;
  S.participantUids=[...new Set(S.playerIds.filter(Boolean))];
  S.activeSets[matchId]=emptySetsList();
  S.pendingPairs=S.pendingPairs.filter(pair=>!((pair.p1===p1&&pair.p2===p2)||(pair.p1===p2&&pair.p2===p1)));
  let previousPairIndex=S.allPairs.findIndex(pair=>isSamePair(pair,previousPair[0],previousPair[1]));
  for(let i=S.allPairs.length-1;i>=0;i--){
    if(i!==previousPairIndex&&isSamePair(S.allPairs[i],p1,p2)){
      S.allPairs.splice(i,1);
      if(i<previousPairIndex)previousPairIndex--;
    }
  }
  const replacementPair={p1,p2,p1Uid:match.p1Uid,p2Uid:match.p2Uid,p1InitialRating:match.p1InitialRating,p2InitialRating:match.p2InitialRating};
  if(previousPairIndex>=0)S.allPairs[previousPairIndex]=replacementPair;
  else S.allPairs.push(replacementPair);
  if(!S.allPairs.some(pair=>isSamePair(pair,previousPair[0],previousPair[1])))S.allPairs.push({p1:previousPair[0],p2:previousPair[1],p1Uid:previousPairUids[0],p2Uid:previousPairUids[1],p1InitialRating:previousPairInitialRatings[0],p2InitialRating:previousPairInitialRatings[1]});
  if(!S.pendingPairs.some(pair=>isSamePair(pair,previousPair[0],previousPair[1])))S.pendingPairs.push({p1:previousPair[0],p2:previousPair[1],p1Uid:previousPairUids[0],p2Uid:previousPairUids[1],p1InitialRating:previousPairInitialRatings[0],p2InitialRating:previousPairInitialRatings[1]});
  fillTables();
  render();
  saveState().then(saved=>{if(!saved)alert('変更をFirestoreに保存できませんでした');});
}

function buildAllPairs(players){
  const pairs=[];
  for(let i=0;i<players.length;i++)
    for(let j=i+1;j<players.length;j++)
      pairs.push({p1:players[i],p2:players[j],p1Uid:S.playerIds[i]||'',p2Uid:S.playerIds[j]||'',p1InitialRating:S.playerInitialRatings[S.playerIds[i]]??1500,p2InitialRating:S.playerInitialRatings[S.playerIds[j]]??1500});
  return shuffle(pairs);
}

function getWinCount(){return Math.ceil(S.setsCount/2);}
function getMatchLimit(){return S.maxMatches===''||S.maxMatches===null||S.maxMatches===undefined?Infinity:Number(S.maxMatches);}
function getPlayerMatchCount(player){return getCountedHistory().filter(match=>match.p1===player||match.p2===player).length+S.activeMatches.filter(match=>match.p1===player||match.p2===player).length;}
function getPlayerWinRate(player){
  let wins=0,games=0;
  for(const match of getCountedHistory()){
    if(match.p1!==player&&match.p2!==player)continue;
    const result=calcSets(match.sets);
    const won=result.w1>result.w2?match.p1:match.p2;
    if(won===player)wins++;
    games++;
  }
  return games?wins/games:0;
}
function getEligiblePendingPairs(busy=new Set()){
  const limit=getMatchLimit();
  const available=S.pendingPairs.filter(pair=>{
    if(busy.has(pair.p1)||busy.has(pair.p2))return false;
    const count1=getPlayerMatchCount(pair.p1),count2=getPlayerMatchCount(pair.p2);
    return Math.abs(count1-count2)<=1;
  });
  const candidates=available.filter(pair=>getPlayerMatchCount(pair.p1)<limit&&getPlayerMatchCount(pair.p2)<limit);
  if(!candidates.length){
    if(Number.isFinite(limit)){
      const underLimit=S.players.filter(player=>!busy.has(player)&&getPlayerMatchCount(player)<limit);
      if(underLimit.length===1){
        const player=underLimit[0];
        return available.filter(pair=>(pair.p1===player&&getPlayerMatchCount(pair.p2)>=limit)||(pair.p2===player&&getPlayerMatchCount(pair.p1)>=limit));
      }
    }
    return [];
  }
  const sameCountCandidates=candidates.filter(pair=>getPlayerMatchCount(pair.p1)===getPlayerMatchCount(pair.p2));
  const fairCandidates=sameCountCandidates.length?sameCountCandidates:candidates;
  const level=pair=>[Math.min(getPlayerMatchCount(pair.p1),getPlayerMatchCount(pair.p2)),Math.max(getPlayerMatchCount(pair.p1),getPlayerMatchCount(pair.p2))];
  const bestLevel=fairCandidates.map(level).sort((a,b)=>a[0]-b[0]||a[1]-b[1])[0];
  return fairCandidates.filter(pair=>{
    const pairLevel=level(pair);
    return pairLevel[0]===bestLevel[0]&&pairLevel[1]===bestLevel[1];
  });
}
function emptySetsList(count=S.setsCount){return Array(count).fill(null).map(()=>[null,null]);}

function ensureMatchSets(mid){
  let sets=S.activeSets[mid];
  if(typeof sets === 'string'){
    try{sets=JSON.parse(sets);}catch(error){sets=null;}
  }
  if(!Array.isArray(sets))sets=emptySetsList();
  for(let i=0;i<sets.length;i++){
    if(!Array.isArray(sets[i]))sets[i]=[null,null];
    if(sets[i].length<2)sets[i]=[sets[i][0]??null, null];
  }
  S.activeSets[mid]=sets;
  return sets;
}

function updateAutomaticOpponentScore(mid, setIndex, side, score){
  const sets=ensureMatchSets(mid);
  const value=Number(score);
  if(!Number.isFinite(value))return;
  sets[setIndex][side]=value;
  const opponent=side===0?1:0;
  sets[setIndex][opponent]=value<=9?11:value+2;
}

function calcSets(sets){
  let w1=0,w2=0;
  for(const[a,b]of sets){
    const score1=Number(a),score2=Number(b);
    // どちらも11点未満なら途中セットなので、セット数には加算しません。
    if(score1<11&&score2<11)continue;
    // 11点以上になったセットだけ、点数が多い側を1セット加算します。
    if(score1>score2)w1++;
    else if(score2>score1)w2++;
  }
  return{w1,w2};
}

function busyPlayers(){
  const s=new Set();
  for(const m of S.activeMatches){s.add(m.p1);s.add(m.p2);}
  return s;
}

function recentlyPlayed(){
  const rp={};
  const history=getCountedHistory();
  for(let i=history.length-1;i>=0;i--){
    const h=history[i];
    if(!rp[h.p1])rp[h.p1]=history.length-i;
    if(!rp[h.p2])rp[h.p2]=history.length-i;
    if(Object.keys(rp).length===S.players.length)break;
  }
  return rp;
}

function assignNewMatch(tableIdx){
  const busy=busyPlayers();
  const candidates=getEligiblePendingPairs(busy);
  if(!candidates.length)return false;
  if(S.matchFormat==='ranked'){
    const pair=selectRankedPair(busy);
    if(!pair)return false;
    const index=S.pendingPairs.findIndex(p=>(p.p1===pair.p1&&p.p2===pair.p2)||(p.p1===pair.p2&&p.p2===pair.p1));
    if(index<0)return false;
    const selected=S.pendingPairs.splice(index,1)[0];
    const id=`${selected.p1}__${selected.p2}__${Date.now()}__${tableIdx}`;
    S.activeMatches.push({...selected,id,tableIdx});
    S.activeSets[id]=emptySetsList();
    return true;
  }
  const rp=recentlyPlayed();
  const capException=candidates.some(pair=>getPlayerMatchCount(pair.p1)>=getMatchLimit()||getPlayerMatchCount(pair.p2)>=getMatchLimit());
  let best=null,bestScore=-Infinity;
  let bestWinDifference=Infinity;
  for(const candidate of candidates){
    const{p1,p2}=candidate;
    const score=(rp[p1]||0)+(rp[p2]||0);
    const winDifference=Math.abs(getPlayerWinRate(p1)-getPlayerWinRate(p2));
    if(capException?(winDifference<bestWinDifference||(winDifference===bestWinDifference&&score>bestScore)):score>bestScore){
      bestWinDifference=winDifference;bestScore=score;best=candidate;
    }
  }
  if(best===null)return false;
  const index=S.pendingPairs.indexOf(best);
  const pair=S.pendingPairs.splice(index,1)[0];
  const id=`${pair.p1}__${pair.p2}__${Date.now()}__${tableIdx}`;
  S.activeMatches.push({...pair,id,tableIdx});
  S.activeSets[id]=emptySetsList();
  return true;
}

function selectRankedPair(busy){
  const stats={};
  for(const player of S.players)stats[player]={wins:0,games:0};
  for(const match of getCountedHistory()){
    const result=calcSets(match.sets);
    const winner=result.w1>result.w2?match.p1:match.p2;
    stats[match.p1].games++;stats[match.p2].games++;
    stats[winner].wins++;
  }
  const winRate=player=>stats[player].games?stats[player].wins/stats[player].games:0;
  const rating=player=>Number(S.playerRatings[S.players.indexOf(player)])||0;
  const candidates=getEligiblePendingPairs(busy);
  if(!candidates.length)return null;
  const balancedCandidates=candidates;
  const winDifference=pair=>Math.abs(winRate(pair.p1)-winRate(pair.p2));
  const bestWinDifference=Math.min(...balancedCandidates.map(winDifference));
  const closestWinCandidates=balancedCandidates.filter(pair=>winDifference(pair)===bestWinDifference);

  const formulaScore=pair=>{
    const count=getPlayerMatchCount(pair.p1);
    const rate=winRate(pair.p1);
    if(count!==getPlayerMatchCount(pair.p2)||rate!==winRate(pair.p2))return Infinity;
    const group=S.players.filter(player=>!busy.has(player)&&getPlayerMatchCount(player)<getMatchLimit()&&getPlayerMatchCount(player)===count&&winRate(player)===rate);
    group.sort((a,b)=>rating(b)-rating(a));
    const firstIndex=group.indexOf(pair.p1);
    const secondIndex=group.indexOf(pair.p2);
    if(firstIndex<0||secondIndex<0)return Infinity;
    const lowIndex=Math.min(firstIndex,secondIndex);
    const highIndex=Math.max(firstIndex,secondIndex);
    const offset=Math.ceil(group.length/2);
    let fallbackScore=Infinity;
    for(let k=0;k<Math.floor(group.length/2);k++){
      const expectedHigh=k+offset;
      if(lowIndex===k&&highIndex===expectedHigh)return k;
      fallbackScore=Math.min(fallbackScore,group.length+Math.abs(lowIndex-k)+Math.abs(highIndex-expectedHigh));
    }
    return fallbackScore;
  };

  closestWinCandidates.sort((a,b)=>{
    const aFormula=formulaScore(a),bFormula=formulaScore(b);
    if(aFormula!==bFormula)return aFormula-bFormula;
    const aWinTotal=winRate(a.p1)+winRate(a.p2),bWinTotal=winRate(b.p1)+winRate(b.p2);
    if(aWinTotal!==bWinTotal)return bWinTotal-aWinTotal;
    return Math.max(rating(b.p1),rating(b.p2))-Math.max(rating(a.p1),rating(a.p2));
  });
  return closestWinCandidates[0]||null;
}

function fillTables(){
  let added=true;
  while(added){
    added=false;
    const freeTables=[];
    const usedTables=new Set(S.activeMatches.map(m=>m.tableIdx));
    for(let i=0;i<S.tables;i++)if(!usedTables.has(i))freeTables.push(i);
    if(freeTables.length===0)break;
    for(const ti of freeTables){
      if(assignNewMatch(ti))added=true;
    }
  }
}

async function startLeague(){
  if(!canOrganize()){alert('試合を作成できるのは主催者ユーザーです');return;}
  const requestedLimit=document.getElementById('maxMatchCount')?.value??S.maxMatches??'';
  if(requestedLimit!==''){
    const limit=Number(requestedLimit);
    if(!Number.isInteger(limit)||limit<1){alert('規定試合数は1以上の整数で入力してください');return;}
    S.maxMatches=limit;
  }else{
    S.maxMatches='';
  }
  ensurePlayerIds();
  const participants=S.players.map((name,index)=>({name:name.trim(),rating:S.playerRatings[index],uid:S.playerIds[index]||''})).filter(player=>player.name);
  const selectedUserIds=participants.map(player=>player.uid).filter(Boolean);
  if(new Set(selectedUserIds).size!==selectedUserIds.length){alert('同じユーザーを複数の選手枠に指定できません');return;}
  if(S.matchFormat==='ranked'&&participants.some(player=>player.rating===undefined||player.rating===''||!Number.isFinite(Number(player.rating)))){
    alert('勝率順対戦では全員のレートを入力してください');
    return;
  }
  S.players=participants.map(player=>player.name);
  S.playerIds=participants.map(player=>player.uid);
  S.participantUids=[...new Set(S.playerIds.filter(Boolean))];
  S.playerRatings=participants.map(player=>Number(player.rating)||0);
  if(S.players.length<2){
    alert('選手を2名以上入力してください');
    return;
  }
  S.playerInitialRatings={};
  await Promise.all(S.playerIds.filter(Boolean).map(async uid=>{
    try{
      const profile=await getDoc(doc(db,'users',uid));
      const initialRating=profile.exists()?Number(profile.data().initialRating):NaN;
      S.playerInitialRatings[uid]=Number.isFinite(initialRating)?initialRating:1500;
    }catch(error){
      console.error('参加者レートの読み込みに失敗しました',error);
      S.playerInitialRatings[uid]=1500;
    }
  }));
  const requestedId=(document.getElementById('matchIdInput')?.value||'').replace(/\D/g,'');
  if(requestedId){
    if(!/^\d{6}$/.test(requestedId)){alert('試合番号は6桁の数字で入力してください');return;}
    if(loadState(requestedId)||await loadRemoteState(requestedId)){setMatchUrl(requestedId);S.phase='league';S.view='matches';watchMatch(requestedId);render();return;}
    S.matchId=requestedId;
  }else if(!S.matchId){
    S.matchId=createMatchId();
  }
  S.allPairs=buildAllPairs(S.players);
  S.pendingPairs=[...S.allPairs];
  S.activeMatches=[];S.activeSets={};S.history=[];
  S.phase='league';S.view='matches';
  fillTables();
  setMatchUrl(S.matchId);
  watchMatch(S.matchId);
  const saved=await saveState();
  render();
  if(!saved){
    alert(`試合番号 ${S.matchId} をFirestoreへ保存できませんでした。\n\nFirestoreのDatabase作成状態とルールを確認してください。`);
  }
}

function confirmMatch(mid){
  const m=S.activeMatches.find(x=>x.id===mid);
  if(!m)return;
  const sets=S.activeSets[mid]||emptySetsList();
  const r=calcSets(sets);
  const winCount=getWinCount();
  if(r.w1<winCount&&r.w2<winCount){alert('先に'+winCount+'セット取る必要があります');return;}
  const ti=m.tableIdx;
  S.history.push({id:mid,p1:m.p1,p2:m.p2,p1Uid:m.p1Uid||'',p2Uid:m.p2Uid||'',p1InitialRating:m.p1InitialRating??1500,p2InitialRating:m.p2InitialRating??1500,sets:sets.map(s=>[...s]),tableLabel:`台${ti+1}`,ts:Date.now()});
  S.activeMatches=S.activeMatches.filter(x=>x.id!==mid);
  delete S.activeSets[mid];
  fillTables();
  render();
}

function getLeague(){
  const ps=S.players.filter(x=>x);
  const history=getCountedHistory();
  const stats={};
  for(const p of ps)stats[p]={w:0,l:0,sw:0,sl:0};
  for(const h of history){
    const r=calcSets(h.sets);
    const w=r.w1>r.w2?h.p1:h.p2,l=r.w1>r.w2?h.p2:h.p1;
    stats[w].w++;stats[l].l++;
    stats[h.p1].sw+=r.w1;stats[h.p1].sl+=r.w2;
    stats[h.p2].sw+=r.w2;stats[h.p2].sl+=r.w1;
  }
  let ranked=Object.entries(stats).map(([p,s])=>({p,...s}));
  ranked.sort((a,b)=>{
    if(b.w!==a.w)return b.w-a.w;
    const dh=history.find(h=>isSamePair(h,a.p,b.p));
    if(dh){
      const r=calcSets(dh.sets);
      const aw=dh.p1===a.p?r.w1:r.w2,bw=dh.p1===b.p?r.w1:r.w2;
      if(aw!==bw)return bw-aw;
    }
    const aRatio=a.sl===0?(a.sw>0?999:0):a.sw/a.sl;
    const bRatio=b.sl===0?(b.sw>0?999:0):b.sw/b.sl;
    return bRatio-aRatio;
  });
  // Handle three-way ties
  for(let i=0;i<ranked.length;){
    let j=i;
    while(j<ranked.length&&ranked[j].w===ranked[i].w)j++;
    if(j-i>=3){
      const group=ranked.slice(i,j);
      const tiePs=group.map(x=>x.p);
      const subStats={};
      for(const p of tiePs)subStats[p]={sw:0,sl:0};
      for(const h of history){
        if(tiePs.includes(h.p1)&&tiePs.includes(h.p2)){
          const r=calcSets(h.sets);
          subStats[h.p1].sw+=r.w1;subStats[h.p1].sl+=r.w2;
          subStats[h.p2].sw+=r.w2;subStats[h.p2].sl+=r.w1;
        }
      }
      group.sort((a,b)=>{
        const aR=subStats[a.p].sl===0?(subStats[a.p].sw>0?999:0):subStats[a.p].sw/subStats[a.p].sl;
        const bR=subStats[b.p].sl===0?(subStats[b.p].sw>0?999:0):subStats[b.p].sw/subStats[b.p].sl;
        return bR-aR;
      });
      for(let k=0;k<group.length;k++)ranked[i+k]=group[k];
    }
    i=j;
  }
  return ranked;
}

function startEditHistory(id){
  const h=S.history.find(x=>x.id===id);
  if(!h||h.deleted)return;
  S.editingHistory[id]=true;
  S.editingSets[id]=h.sets.map(s=>[s[0],s[1]]);
}

function cancelEditHistory(id){
  delete S.editingHistory[id];
  delete S.editingSets[id];
}

function saveHistoryEdit(id){
  const h=S.history.find(x=>x.id===id);
  if(!h||h.deleted)return;
  const sets=S.editingSets[id]||h.sets;
  const normalized=sets.map(([a,b])=>[a===null||a===' '||a===''?null:parseInt(a,10),b===null||b===' '||b===''?null:parseInt(b,10)]);
  for(const row of normalized){
    if(row[0]!==null&&isNaN(row[0]))row[0]=null;
    if(row[1]!==null&&isNaN(row[1]))row[1]=null;
  }
  const r=calcSets(normalized);
  const winCount=getWinCount();
  if(r.w1<winCount&&r.w2<winCount){alert('先に'+winCount+'セット取る必要があります');return;}
  if(r.w1===r.w2){alert('勝敗が決まるように点数を入力してください');return;}
  h.sets=normalized;
  delete S.editingHistory[id];
  delete S.editingSets[id];
}

function buildExportText(){
  const history=getCountedHistory();
  if(!history.length)return '試合結果がありません';
  return history.map(h=>{
    const r=calcSets(h.sets);
    const sets=h.sets.filter(([a,b])=>a!==null&&b!==null).map(([a,b])=>`${a}-${b}`).join(', ');
    return `${h.tableLabel} ${h.p1} vs ${h.p2} ${r.w1}-${r.w2} (${sets})`;
  }).join('\r\n');
}

function renderRatingChart(points){
  if(!points.length)return '<div style="color:#888;padding:18px 0">レートの推移は、試合が確定すると表示されます。</div>';
  const width=720,height=240,padding={top:18,right:20,bottom:30,left:48};
  const values=points.map(point=>point.rating);
  const min=Math.floor(Math.min(...values)/50)*50-50;
  const max=Math.ceil(Math.max(...values)/50)*50+50;
  const x=index=>padding.left+(points.length===1?0:index*(width-padding.left-padding.right)/(points.length-1));
  const y=rating=>padding.top+(max-rating)*(height-padding.top-padding.bottom)/(max-min);
  const grid=[0,1,2,3].map(index=>{
    const value=max-(max-min)*index/3;
    const gridY=y(value);
    return `<line x1="${padding.left}" y1="${gridY}" x2="${width-padding.right}" y2="${gridY}" stroke="#e5e5e5"/><text x="${padding.left-8}" y="${gridY+4}" text-anchor="end" fill="#777" font-size="12">${Math.round(value)}</text>`;
  }).join('');
  const line=points.map((point,index)=>`${x(index)},${y(point.rating)}`).join(' ');
  const marks=points.map((point,index)=>`<circle cx="${x(index)}" cy="${y(point.rating)}" r="4" fill="#e63000"><title>${new Date(point.ts).toLocaleDateString('ja-JP')} ${Math.round(point.rating)} (${point.change>=0?'+':''}${point.change.toFixed(1)})</title></circle>`).join('');
  return `<svg class="rating-chart" viewBox="0 0 ${width} ${height}" role="img" aria-label="試合ごとのレート推移"><title>レート推移</title>${grid}<polyline points="${line}" fill="none" stroke="#e63000" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>${marks}<text x="${padding.left}" y="${height-6}" fill="#777" font-size="12">${new Date(points[0].ts).toLocaleDateString('ja-JP')}</text><text x="${width-padding.right}" y="${height-6}" text-anchor="end" fill="#777" font-size="12">${new Date(points[points.length-1].ts).toLocaleDateString('ja-JP')}</text></svg>`;
}

function renderMatches(){
  const limit=getMatchLimit();
  const total=Number.isFinite(limit)?Math.min(S.allPairs.length,Math.floor(S.players.length*limit/2)):S.allPairs.length;
  const done=getCountedHistory().length;
  const winCount=getWinCount();
  const setsCount=S.setsCount;
  let html=`<div style="color:#888;font-size:12px;margin-bottom:10px">進行中: ${S.activeMatches.length}試合 ／ 完了: ${done} ／ 全 ${total} 試合</div>`;
  html+=`<div class="grid-tables">`;
  for(let ti=0;ti<S.tables;ti++){
    const m=S.activeMatches.find(x=>x.tableIdx===ti);
    if(!m){
      const noPending=S.activeMatches.length===0&&getEligiblePendingPairs().length===0;
      html+=noPending?'':`<div class="empty-slot">台${ti+1}<br>待機中</div>`;
      continue;
    }
    const sets=S.activeSets[m.id]||emptySetsList();
    const{w1,w2}=calcSets(sets);
    const finished=w1>=winCount||w2>=winCount;
    html+=`<div class="match-card active" data-card="${escapeHtml(m.id)}">
      <div class="match-header">
        <span class="table-label">台${ti+1}</span>
        <div style="display:flex;align-items:center;gap:8px;">
          <button class="ghost" data-open-score="${escapeHtml(m.id)}">得点板</button>
        </div>
        <span class="badge live">● LIVE</span>
      </div>
      <div class="players-line">${escapeHtml(m.p1)} <span class="vs">vs</span> ${escapeHtml(m.p2)}</div>
      ${adminUser?`<div class="admin-player-editor"><div class="admin-player-title">対戦選手の変更</div><label class="admin-player-field"><span>選手 1</span><select data-replace-p1="${escapeHtml(m.id)}">${S.players.map(player=>`<option value="${escapeHtml(player)}" ${player===m.p1?'selected':''}>${escapeHtml(player)}</option>`).join('')}</select></label><span class="admin-player-versus">対</span><label class="admin-player-field"><span>選手 2</span><select data-replace-p2="${escapeHtml(m.id)}">${S.players.map(player=>`<option value="${escapeHtml(player)}" ${player===m.p2?'selected':''}>${escapeHtml(player)}</option>`).join('')}</select></label><button class="ghost admin-player-save" data-save-replacement="${escapeHtml(m.id)}">選手を保存</button></div>`:''}
      <div style="margin-top:10px">
        ${Array(setsCount).fill(0).map((_,i)=>{
          const[a,b]=sets[i]||[null,null];
          const prevW1=calcSets(sets.slice(0,i)).w1,prevW2=calcSets(sets.slice(0,i)).w2;
          const dis=(prevW1>=winCount||prevW2>=winCount)||((w1>=winCount||w2>=winCount)&&a===null&&b===null);
          return`<div class="score-row">
            <span class="lbl r">第${i+1}セット</span>
            <input type="number" data-mid="${escapeHtml(m.id)}" data-set="${i}" data-side="0" value="${a!==null?a:''}" min="0" max="40" placeholder="" ${dis?'disabled':''}>
            <span class="sep">-</span>
            <input type="number" data-mid="${escapeHtml(m.id)}" data-set="${i}" data-side="1" value="${b!==null?b:''}" min="0" max="40" placeholder="" ${dis?'disabled':''}>
            <span class="lbl"></span>
          </div>`;
        }).join('')}
      </div>
      ${(w1>0||w2>0)?`<div class="total-row"><span class="total-score">${w1} - ${w2}</span>${finished?`<span class="winner-badge">${escapeHtml(w1>w2?m.p1:m.p2)} 勝利！</span>`:''}</div>`:''}
      ${finished?`<button class="confirm-btn" data-confirm="${escapeHtml(m.id)}">✔ 確定</button>`:''}
    </div>`;
  }
  html+=`</div>`;
  const next=getEligiblePendingPairs(busyPlayers());
  if(next.length>0){
    html+=`<div class="remaining-info">次の対戦候補: ${next.slice(0,3).map(p=>`${escapeHtml(p.p1)} vs ${escapeHtml(p.p2)}`).join(' / ')}${next.length>3?' など':''}</div>`;
  }else if(S.activeMatches.length>0&&S.pendingPairs.length>0){
    html+=`<div class="remaining-info">次の対戦は進行中の試合終了後に判定します</div>`;
  }
  if(S.activeMatches.length===0&&getEligiblePendingPairs().length===0){
    html+=`<div class="card" style="text-align:center;padding:24px"><div style="font-size:18px;font-weight:800;color:#e63000;margin-bottom:6px">🏆 全試合終了！</div><div style="color:#888;font-size:12px">リーグ表タブで最終結果をご確認ください</div></div>`;
  }
  return html;
}

function renderHistory(){
  if(!S.history.length)return`<div class="card"><div style="color:#888;text-align:center;padding:20px">まだ試合結果がありません</div></div>`;
  let html=`<div class="card"><div class="section-title">全試合結果</div>`;
  for(let i=S.history.length-1;i>=0;i--){
    const h=S.history[i];
    const deleted=!!h.deleted;
    const r=calcSets(h.sets);
    const winCount=getWinCount();
    const finished=r.w1>=winCount||r.w2>=winCount;
    const winner=finished? (r.w1>r.w2?h.p1:h.p2):'未確定';
    const inEdit=!deleted&&!!S.editingHistory[h.id];
    const editSets=S.editingSets[h.id] || h.sets;
    const setsStr=h.sets.filter(([a,b])=>a!==null&&b!==null).map(([a,b])=>`${a}-${b}`).join('、');
    const setRows=inEdit?editSets.map((set,i)=>{
      const[a,b]=set||[null,null];
      return `<div style="display:flex;align-items:center;gap:8px;margin-top:8px"><span class="lbl" style="min-width:80px">第${i+1}セット</span><input type="number" data-hid="${escapeHtml(h.id)}" data-set="${i}" data-side="0" value="${a!==null?a:''}" min="0" max="40" style="width:72px"><span style="font-size:18px">-</span><input type="number" data-hid="${escapeHtml(h.id)}" data-set="${i}" data-side="1" value="${b!==null?b:''}" min="0" max="40" style="width:72px"></div>`;
    }).join(''):`<div class="history-sets">各セット: ${setsStr}</div>`;
    html+=`<div class="history-item${deleted?' deleted':''}" data-history="${escapeHtml(h.id)}">
      <div style="flex:1">
        <div style="font-weight:700">${escapeHtml(h.p1)} <span style="color:#e63000">${r.w1}-${r.w2}</span> ${escapeHtml(h.p2)}</div>
        ${deleted?`<div style="margin-top:6px;color:#777;font-weight:700">（削除された試合）</div>`:''}
        ${setRows}
        <div style="margin-top:8px"><span class="table-label">${h.tableLabel}</span></div>
      </div>
      <div style="display:flex;flex-direction:column;gap:10px;align-items:flex-end">
        <span class="winner-badge">${deleted?'削除済み':escapeHtml(winner)}</span>
        ${deleted?'':inEdit?`<button class="ghost" data-cancel-history="${escapeHtml(h.id)}">キャンセル</button>`:`<button class="ghost" data-edit-history="${escapeHtml(h.id)}">編集</button>`}
        ${inEdit?`<button class="confirm-btn" data-save-history="${escapeHtml(h.id)}">保存</button>`:''}
      </div>
    </div>`;
  }
  return html+`</div>`;
}

function renderLeagueView(){
  const ps=S.players.filter(x=>x);
  const league=getLeague();
  const exportText=buildExportText();
  let html=`<div class="card"><div class="section-title">対戦マトリクス</div><div style="overflow-x:auto"><table><tr><th></th>`;
  for(const p of ps)html+=`<th>${escapeHtml(p)}</th>`;
  html+=`</tr>`;
  for(const p1 of ps){
    html+=`<tr><td style="font-weight:700;text-align:left;background:#f7f8fa;white-space:nowrap">${escapeHtml(p1)}</td>`;
    for(const p2 of ps){
      if(p1===p2){html+=`<td style="background:#f7f8fa">―</td>`;continue;}
      const h=getCountedHistory().find(h=>isSamePair(h,p1,p2));
      if(!h){html+=`<td style="color:#ddd">未</td>`;continue;}
      const r=calcSets(h.sets);const[my,op]=h.p1===p1?[r.w1,r.w2]:[r.w2,r.w1];
      html+=`<td style="font-weight:700;color:${my>op?'#2a8a2a':'#cc2200'}">${my}-${op}</td>`;
    }
    html+=`</tr>`;
  }
  html+=`</table></div></div>`;
  html+=`<div class="card"><div class="section-title">順位表</div><table><tr><th>#</th><th style="text-align:left">選手</th><th>試合</th><th>勝</th><th>負</th><th>セット</th></tr>`;
  league.forEach((r,i)=>{
    const medal=i===0?'🥇':i===1?'🥈':i===2?'🥉':''
    const cls=i===0?'rank1':i===1?'rank2':i===2?'rank3':'';
    html+=`<tr class="${cls}"><td>${medal||i+1}</td><td style="text-align:left;font-weight:600">${escapeHtml(r.p)}</td><td style="color:#888">${r.w+r.l}</td><td style="color:#2a8a2a;font-weight:700">${r.w}</td><td style="color:#cc2200">${r.l}</td><td>${r.sw}-${r.sl}</td></tr>`;
  });
  html+=`</table></div>`;
  html+=`<div class="card"><div class="section-title">テキスト出力</div><button class="ghost" id="exportBtn" style="font-size:18px;padding:12px 18px">試合結果をテキスト出力</button>`;
  if(S.exportVisible){
    html+=`<textarea id="exportTextArea" readonly rows="10" style="width:100%;font-size:14px;padding:12px;margin-top:12px;white-space:pre-wrap;resize:vertical">${escapeHtml(exportText)}</textarea><button class="ghost" id="copyExportBtn" style="margin-top:12px;font-size:18px;padding:12px 18px">結果をコピー</button>`;
  }
  html+=`</div>`;
  return html;
}

function updateMatchCard(mid){
  const card=[...document.querySelectorAll('[data-card]')].find(element=>element.dataset.card===mid);
  if(!card)return;
  const m=S.activeMatches.find(x=>x.id===mid);
  if(!m)return;
  const sets=ensureMatchSets(mid);
  const{w1,w2}=calcSets(sets);
  const winCount=getWinCount();
  const finished=w1>=winCount||w2>=winCount;
  let totalRow=card.querySelector('.total-row');
  if(w1>0||w2>0){
    const html=`<span class="total-score">${w1} - ${w2}</span>${finished?`<span class="winner-badge">${w1>w2?m.p1:m.p2} 勝利！</span>`:''}`;
    if(totalRow){totalRow.innerHTML=html;}
    else{totalRow=document.createElement('div');totalRow.className='total-row';totalRow.innerHTML=html;card.appendChild(totalRow);}
  }
  let cb=card.querySelector('.confirm-btn');
  if(finished){
    if(!cb){cb=document.createElement('button');cb.className='confirm-btn';cb.dataset.confirm=mid;cb.textContent='✔ 確定';cb.addEventListener('click',()=>confirmMatch(mid));card.appendChild(cb);}
  } else {if(cb)cb.remove();}
  card.querySelectorAll('input[data-mid]').forEach(inp=>{
    const si=parseInt(inp.dataset.set),side=parseInt(inp.dataset.side);
    const[a,b]=sets[si]||[null,null];
    const prevW1=calcSets(sets.slice(0,si)).w1,prevW2=calcSets(sets.slice(0,si)).w2;
    const dis=(prevW1>=winCount||prevW2>=winCount)||((w1>=winCount||w2>=winCount)&&a===null&&b===null);
    if(document.activeElement!==inp){inp.value=(side===0?a:b)!==null?(side===0?a:b):'';}
    inp.disabled=dis;
  });
  saveState();
}

// ==================== スコアボードの数字 ====================
// 試合を開いた直後の左右の得点です。ここを 0 から変えると、試合を開いた直後の大きな数字が変わります。
const SCOREBOARD_START_POINT=0;
// 試合を開いた直後の左右のセット数です。ここを 0 から変えると、中央のセット数が変わります。
const SCOREBOARD_START_SET=0;
// left/right は左右の大きな得点、leftSets/rightSets は中央のセット数です。
const SB={mid:null,left:SCOREBOARD_START_POINT,right:SCOREBOARD_START_POINT,leftSets:SCOREBOARD_START_SET,rightSets:SCOREBOARD_START_SET};

// SB の数字を、HTML上の左右の得点と中央のセット数へ反映します。
function updateScoreboardUI(){
  const ol=document.getElementById('scoreboardOverlay');
  if(!ol) return;
  document.getElementById('sbLeftName').textContent=SB.leftName||'';
  document.getElementById('sbRightName').textContent=SB.rightName||'';
  document.getElementById('sbLeftPoint').textContent=SB.left;
  document.getElementById('sbRightPoint').textContent=SB.right;
  document.getElementById('sbLeftSets').textContent=SB.leftSets;
  document.getElementById('sbRightSets').textContent=SB.rightSets;
}

function openScoreboard(mid){
  const m=S.activeMatches.find(x=>x.id===mid);
  if(!m) return alert('試合が見つかりません');
  SB.mid=mid;
  const sets=S.activeSets[mid]||emptySetsList();
  // 11点以上になったセットは完了。最初の未完了セットを現在のセットにします。
  const isCompletedSet=([a,b])=>Number(a)>=11||Number(b)>=11;
  const curIdx=sets.findIndex(set=>!isCompletedSet(set));
  const completedCount=sets.filter(isCompletedSet).length;
  // セット確定のたびに左右を入れ替えるため、完了セット数の奇数・偶数で名前を復元します。
  const swapped=completedCount%2===1;
  SB.leftName=swapped?m.p2:m.p1;
  SB.rightName=swapped?m.p1:m.p2;
  // 途中セットの点数を表示し、未入力なら0-0で開始します。
  const current=curIdx===-1?[null,null]:sets[curIdx];
  const p1point=current[0]===null?SCOREBOARD_START_POINT:Number(current[0])||0;
  const p2point=current[1]===null?SCOREBOARD_START_POINT:Number(current[1])||0;
  SB.left=swapped?p2point:p1point;
  SB.right=swapped?p1point:p2point;
  const r=calcSets(sets.filter(isCompletedSet));
  SB.leftSets=swapped?r.w2:r.w1;
  SB.rightSets=swapped?r.w1:r.w2;
  const ol=document.getElementById('scoreboardOverlay');
  if(ol){ol.classList.add('is-open');}
  updateScoreboardUI();
}

function closeScoreboard(){
  const ol=document.getElementById('scoreboardOverlay');
  if(ol) ol.classList.remove('is-open');
  SB.mid=null;
}

function applyScoreToMatch(commit){
  const mid=SB.mid; if(!mid) return;
  if(!S.activeSets[mid]) S.activeSets[mid]=emptySetsList();
  const sets=S.activeSets[mid];
  // 得点板のセット数の合計から書き込み先を決めます。既存の点数があっても、この行を上書きします。
  const requestedIndex=Number(SB.leftSets)+Number(SB.rightSets);
  const useIdx=Math.max(0,Math.min(sets.length-1,requestedIndex));
  // Map left/right scoreboard values to match p1/p2 by name (left/right display may swap)
  const m=S.activeMatches.find(x=>x.id===mid);
  if(!m) return;
  let p1score,p2score;
  // if SB.leftName corresponds to m.p1, left->p1, else left->p2
  if(SB.leftName===m.p1){ p1score=Number(SB.left)||0; p2score=Number(SB.right)||0; }
  else if(SB.leftName===m.p2){ p1score=Number(SB.right)||0; p2score=Number(SB.left)||0; }
  else { // fallback: assume left->p1
    p1score=Number(SB.left)||0; p2score=Number(SB.right)||0;
  }
  // 今の得点を現在のセットへ保存します。11点未満なら途中経過として残します。
  sets[useIdx]=[p1score,p2score];
  const setFinished=p1score>=11||p2score>=11;
  // 11点以上なら勝者のセット数を1増やし、次のセットを0-0で開始します。
  if(commit&&setFinished){
    const leftWasP1=SB.leftName===m.p1;
    if(p1score>p2score){
      if(leftWasP1)SB.leftSets++;else SB.rightSets++;
    }else if(p2score>p1score){
      if(leftWasP1)SB.rightSets++;else SB.leftSets++;
    }
    // セット確定後は、名前とセット数を左右入れ替えます。
    const tmpName=SB.leftName; SB.leftName=SB.rightName; SB.rightName=tmpName;
    const tmpSets=SB.leftSets; SB.leftSets=SB.rightSets; SB.rightSets=tmpSets;
    SB.left=SCOREBOARD_START_POINT; SB.right=SCOREBOARD_START_POINT;
  }
  updateMatchCard(mid);
  updateScoreboardUI();
}

function resetScoreboard(){
  // 対戦表のS.activeSetsや名前には触れず、スコアボード上の得点とセット数だけを戻します。
  SB.left=SCOREBOARD_START_POINT; SB.right=SCOREBOARD_START_POINT;
  SB.leftSets=SCOREBOARD_START_SET; SB.rightSets=SCOREBOARD_START_SET;
  updateScoreboardUI();
}

  // Modal controls
  const sbOverlay=document.getElementById('scoreboardOverlay');
  const sbLeftPoint=document.getElementById('sbLeftPoint');
  const sbRightPoint=document.getElementById('sbRightPoint');
  const sbLeftSets=document.getElementById('sbLeftSets');
  const sbRightSets=document.getElementById('sbRightSets');
  const sbSwap=document.getElementById('sbSwap');
  const sbClose=document.getElementById('sbClose');
  const sbCommit=document.getElementById('sbCommit');
  const sbApplyClose=document.getElementById('sbApplyClose');
  // 左の黒い得点箱: 右側2/3をクリックすると +1、左側1/3をクリックすると -1 です。
  if(sbLeftPoint) sbLeftPoint.onclick=(e)=>{const rect=e.currentTarget.getBoundingClientRect();const x=e.clientX-rect.left;/* クリック範囲の境界。1/3を変えると増減エリアの広さが変わります。 */if(x>rect.width*(1/3)){SB.left=Number(SB.left)+1}else{SB.left=Math.max(0,Number(SB.left)-1)};updateScoreboardUI();};
  // 右の黒い得点箱: 右側2/3をクリックすると +1、左側1/3をクリックすると -1 です。
  if(sbRightPoint) sbRightPoint.onclick=(e)=>{const rect=e.currentTarget.getBoundingClientRect();const x=e.clientX-rect.left;/* クリック範囲の境界。1/3を変えると増減エリアの広さが変わります。 */if(x>rect.width*(1/3)){SB.right=Number(SB.right)+1}else{SB.right=Math.max(0,Number(SB.right)-1)};updateScoreboardUI();};
  // 中央上のセット数: クリックするたびに左側選手のセット数が +1 されます。
  if(sbLeftSets) sbLeftSets.onclick=()=>{ SB.leftSets=Number(SB.leftSets)+1; updateScoreboardUI(); };
  // 中央下のセット数: クリックするたびに右側選手のセット数が +1 されます。
  if(sbRightSets) sbRightSets.onclick=()=>{ SB.rightSets=Number(SB.rightSets)+1; updateScoreboardUI(); };
  // ⇄: 選手名・得点・セット数を左右入れ替えます。
  if(sbSwap) sbSwap.onclick=()=>{ const tmp=SB.leftName; SB.leftName=SB.rightName; SB.rightName=tmp; const t2=SB.left; SB.left=SB.right; SB.right=t2; const t3=SB.leftSets; SB.leftSets=SB.rightSets; SB.rightSets=t3; updateScoreboardUI(); };
  // ×: スコアボードを閉じます。確定は行いません。
  if(sbClose) sbClose.onclick=()=>{ closeScoreboard(); };
  // 確定: 現在セットを保存し、次のセットへ進みます。
  if(sbCommit) sbCommit.onclick=()=>{ applyScoreToMatch(true); };
  // リセット: セット数と得点をすべて0-0に戻して閉じます。
  if(sbApplyClose) sbApplyClose.onclick=()=>{ resetScoreboard(); };
}

onAuthStateChanged(auth,user=>{
  const version=++authCheckVersion;
  currentUser=user;
  currentMemberId='';
  adminUser=null;
  organizerUser=false;
  currentUserRating=NaN;
  currentUserRatingTier='';
  currentUserInitialRating=NaN;
  const updateAccess=async()=>{
    if(user&&!user.isAnonymous){
      const matchesAdminUid=user.uid===ADMIN_UID;
      const matchesOrganizerUid=user.uid===ORGANIZER_UID;
      if(matchesAdminUid){
        adminUser=user;
        organizerUser=true;
      }
      if(matchesOrganizerUid){
        organizerUser=true;
      }
      if(matchesAdminUid||matchesOrganizerUid){
        S.phase='setup';
        render();
      }else{
        console.info('登録UIDと不一致', { signedInUid:user.uid, configuredAdminUid:ADMIN_UID, configuredOrganizerUid:ORGANIZER_UID });
      }
      ensureUserProfile(user).then(profile=>{
        if(version!==authCheckVersion||auth.currentUser?.uid!==user.uid)return;
        currentMemberId=profile?.memberId||'';
        currentUserRatingTier=profile?.ratingTier||'';
        currentUserInitialRating=Number.isFinite(Number(profile?.initialRating))?Number(profile.initialRating):NaN;
        currentUserRating=currentUserInitialRating;
        render();
      }).catch(error=>console.error('ユーザープロフィールの準備に失敗しました',error));
      if(!matchesAdminUid){
        try{
          const token=await getIdTokenResult(user,true);
          organizerUser=organizerUser||token.claims.organizer===true||token.claims.admin===true;
          if(token.claims.admin===true)adminUser=user;
        }catch(error){console.error('管理者権限の確認に失敗しました',error);}
      }
    }
    if(version!==authCheckVersion)return;
    if(!user){resetState();S.phase='login';}
    else if(!(await restoreSharedMatch()))S.phase='setup';
    if(version===authCheckVersion)render();
  };
  updateAccess();
});
render();
</script>
