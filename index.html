<h1>🏓 卓球リーグ</h1>
<div class="sub">Table Tennis League Manager</div>
<div id="root"></div>
</div>
<script>
const S={
  phase:'setup',
  tables:2,
  setsCount:5,
  players:['',''],
  allPairs:[],
  pendingPairs:[],
  activeMatches:[],
  activeSets:{},
  history:[],
  view:'matches',
  tableCount:0,
  editingHistory:{},
  editingSets:{},
  exportVisible:false
};

function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}

function buildAllPairs(players){
  const pairs=[];
  for(let i=0;i<players.length;i++)
    for(let j=i+1;j<players.length;j++)
      pairs.push({p1:players[i],p2:players[j]});
  return shuffle(pairs);
}

function getWinCount(){return Math.ceil(S.setsCount/2);}
function emptySetsList(count=S.setsCount){return Array(count).fill(null).map(()=>[null,null]);}

function calcSets(sets){
  let w1=0,w2=0;
  for(const[a,b]of sets){if(a===null||b===null)continue;if(a>b)w1++;else if(b>a)w2++;}
  return{w1,w2};
}

function busyPlayers(){
  const s=new Set();
  for(const m of S.activeMatches){s.add(m.p1);s.add(m.p2);}
  return s;
}

function recentlyPlayed(){
  const rp={};
  for(let i=S.history.length-1;i>=0;i--){
    const h=S.history[i];
    if(!rp[h.p1])rp[h.p1]=S.history.length-i;
    if(!rp[h.p2])rp[h.p2]=S.history.length-i;
    if(Object.keys(rp).length===S.players.length)break;
  }
  return rp;
}

function assignNewMatch(tableIdx){
  const busy=busyPlayers();
  const rp=recentlyPlayed();
  let best=null,bestScore=-Infinity;
  for(let i=0;i<S.pendingPairs.length;i++){
    const{p1,p2}=S.pendingPairs[i];
    if(busy.has(p1)||busy.has(p2))continue;
    const score=(rp[p1]||0)+(rp[p2]||0);
    if(score>bestScore){bestScore=score;best=i;}
  }
  if(best===null)return false;
  const pair=S.pendingPairs.splice(best,1)[0];
  const id=`${pair.p1}__${pair.p2}__${Date.now()}__${tableIdx}`;
  S.activeMatches.push({...pair,id,tableIdx});
  S.activeSets[id]=emptySetsList();
  return true;
}

function fillTables(){
  let added=true;
  while(added){
    added=false;
    const freeTables=[];
    const usedTables=new Set(S.activeMatches.map(m=>m.tableIdx));
    for(let i=0;i<S.tables;i++)if(!usedTables.has(i))freeTables.push(i);
    if(freeTables.length===0)break;
    for(const ti of freeTables){
      if(assignNewMatch(ti))added=true;
    }
  }
}

function startLeague(){
  S.players=S.players.filter(x=>x.trim());
  if(S.players.length<2){
    alert('選手を2名以上入力してください');
    return;
  }
  S.allPairs=buildAllPairs(S.players);
  S.pendingPairs=[...S.allPairs];
  S.activeMatches=[];S.activeSets={};S.history=[];
  S.phase='league';S.view='matches';
  fillTables();
  render();
}

function confirmMatch(mid){
  const m=S.activeMatches.find(x=>x.id===mid);
  if(!m)return;
  const sets=S.activeSets[mid]||emptySetsList();
  const r=calcSets(sets);
  const winCount=getWinCount();
  if(r.w1<winCount&&r.w2<winCount){alert('先に'+winCount+'セット取る必要があります');return;}
  const ti=m.tableIdx;
  S.history.push({id:mid,p1:m.p1,p2:m.p2,sets:sets.map(s=>[...s]),tableLabel:`台${ti+1}`,ts:Date.now()});
  S.activeMatches=S.activeMatches.filter(x=>x.id!==mid);
  delete S.activeSets[mid];
  fillTables();
  render();
}

function getLeague(){
  const ps=S.players.filter(x=>x);
  const stats={};
  for(const p of ps)stats[p]={w:0,l:0,sw:0,sl:0};
  for(const h of S.history){
    const r=calcSets(h.sets);
    const w=r.w1>r.w2?h.p1:h.p2,l=r.w1>r.w2?h.p2:h.p1;
    stats[w].w++;stats[l].l++;
    stats[h.p1].sw+=r.w1;stats[h.p1].sl+=r.w2;
    stats[h.p2].sw+=r.w2;stats[h.p2].sl+=r.w1;
  }
  let ranked=Object.entries(stats).map(([p,s])=>({p,...s}));
  ranked.sort((a,b)=>{
    if(b.w!==a.w)return b.w-a.w;
    const dh=S.history.find(h=>(h.p1===a.p&&h.p2===b.p)||(h.p1===b.p&&h.p2===a.p));
    if(dh){
      const r=calcSets(dh.sets);
      const aw=dh.p1===a.p?r.w1:r.w2,bw=dh.p1===b.p?r.w1:r.w2;
      if(aw!==bw)return bw-aw;
    }
    const aRatio=a.sl===0?(a.sw>0?999:0):a.sw/a.sl;
    const bRatio=b.sl===0?(b.sw>0?999:0):b.sw/b.sl;
    return bRatio-aRatio;
  });
  // Handle three-way ties
  for(let i=0;i<ranked.length;){
    let j=i;
    while(j<ranked.length&&ranked[j].w===ranked[i].w)j++;
    if(j-i>=3){
      const group=ranked.slice(i,j);
      const tiePs=group.map(x=>x.p);
      const subStats={};
      for(const p of tiePs)subStats[p]={sw:0,sl:0};
      for(const h of S.history){
        if(tiePs.includes(h.p1)&&tiePs.includes(h.p2)){
          const r=calcSets(h.sets);
          subStats[h.p1].sw+=r.w1;subStats[h.p1].sl+=r.w2;
          subStats[h.p2].sw+=r.w2;subStats[h.p2].sl+=r.w1;
        }
      }
      group.sort((a,b)=>{
        const aR=subStats[a.p].sl===0?(subStats[a.p].sw>0?999:0):subStats[a.p].sw/subStats[a.p].sl;
        const bR=subStats[b.p].sl===0?(subStats[b.p].sw>0?999:0):subStats[b.p].sw/subStats[b.p].sl;
        return bR-aR;
      });
      for(let k=0;k<group.length;k++)ranked[i+k]=group[k];
    }
    i=j;
  }
  return ranked;
}

function startEditHistory(id){
  const h=S.history.find(x=>x.id===id);
  if(!h)return;
  S.editingHistory[id]=true;
  S.editingSets[id]=h.sets.map(s=>[s[0],s[1]]);
}

function cancelEditHistory(id){
  delete S.editingHistory[id];
  delete S.editingSets[id];
}

function saveHistoryEdit(id){
  const h=S.history.find(x=>x.id===id);
  if(!h)return;
  const sets=S.editingSets[id]||h.sets;
  const normalized=sets.map(([a,b])=>[a===null||a===' '||a===''?null:parseInt(a,10),b===null||b===' '||b===''?null:parseInt(b,10)]);
  for(const row of normalized){
    if(row[0]!==null&&isNaN(row[0]))row[0]=null;
    if(row[1]!==null&&isNaN(row[1]))row[1]=null;
  }
  const r=calcSets(normalized);
  const winCount=getWinCount();
  if(r.w1<winCount&&r.w2<winCount){alert('先に'+winCount+'セット取る必要があります');return;}
  if(r.w1===r.w2){alert('勝敗が決まるように点数を入力してください');return;}
  h.sets=normalized;
  delete S.editingHistory[id];
  delete S.editingSets[id];
}

function buildExportText(){
  if(!S.history.length)return '試合結果がありません';
  return S.history.map(h=>{
    const r=calcSets(h.sets);
    const sets=h.sets.filter(([a,b])=>a!==null&&b!==null).map(([a,b])=>`${a}-${b}`).join(', ');
    return `${h.tableLabel} ${h.p1} vs ${h.p2} ${r.w1}-${r.w2} (${sets})`;
  }).join('\r\n');
}

function render(){
  const root=document.getElementById('root');
  root.innerHTML=S.phase==='setup'?renderSetup():renderMain();
  attachEvents();
}

function renderSetup(){
  return`<div class="card">
  <div class="section-title">基本設定</div>
  <div style="display:flex;align-items:center;gap:24px;margin-bottom:16px">
    <label style="color:#555;font-size:24px;white-space:nowrap">台の数</label>
    <input type="number" id="tableCount" value="${S.tables}" min="1" max="10" style="width:100px">
  </div>
  <div style="display:flex;align-items:center;flex-wrap:wrap;gap:16px;margin-bottom:4px">
    <label style="display:flex;align-items:center;gap:10px;font-size:22px"><input type="radio" name="setCount" value="3" ${S.setsCount===3?'checked':''}> 3セット (2勝)</label>
    <label style="display:flex;align-items:center;gap:10px;font-size:22px"><input type="radio" name="setCount" value="5" ${S.setsCount===5?'checked':''}> 5セット (3勝)</label>
  </div>
</div>
<div class="card">
  <div class="section-title">参加者</div>
  <div id="playerList">${S.players.map((p,i)=>`<div class="player-row"><input type="text" data-pi="${i}" value="${p}" placeholder="選手名 ${i+1}"><button class="rm" data-rm="${i}">✕</button></div>`).join('')}</div>
  <button class="ghost" id="addPlayer" style="margin-top:8px">＋ 選手を追加</button>
</div>
<div style="text-align:center;margin-top:px"><button id="startLeague" style="padding:14px 100px;font-size:16px;letter-spacing:2px">▶ 試合開始</button></div>
${S.players.filter(x=>x.trim()).length>=2?'':`<div class="alert">選手を2名以上入力してください</div>`}`;
}

function renderMain(){
  const header=`<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap"><div class="tab-bar"><div class="tab ${S.view==='matches'?'active':''}" data-tab="matches">対戦表</div><div class="tab ${S.view==='history'?'active':''}" data-tab="history">試合結果</div><div class="tab ${S.view==='league'?'active':''}" data-tab="league">リーグ表</div></div><button class="ghost" id="backToSetup">設定画面に戻る</button></div>`;
  if(S.view==='history')return header+renderHistory();
  if(S.view==='league')return header+renderLeagueView();
  return header+renderMatches();
}

function renderMatches(){
  const total=S.allPairs.length;
  const done=S.history.length;
  const winCount=getWinCount();
  const setsCount=S.setsCount;
  let html=`<div style="color:#888;font-size:12px;margin-bottom:10px">進行中: ${S.activeMatches.length}試合 ／ 完了: ${done} ／ 全 ${total} 試合</div>`;
  html+=`<div class="grid-tables">`;
  for(let ti=0;ti<S.tables;ti++){
    const m=S.activeMatches.find(x=>x.tableIdx===ti);
    if(!m){
      const noPending=S.pendingPairs.length===0&&S.activeMatches.length===0;
      html+=noPending?'':`<div class="empty-slot">台${ti+1}<br>待機中</div>`;
      continue;
    }
    const sets=S.activeSets[m.id]||emptySetsList();
    const{w1,w2}=calcSets(sets);
    const finished=w1>=winCount||w2>=winCount;
    html+=`<div class="match-card active" data-card="${m.id}">
      <div class="match-header">
        <span class="table-label">台${ti+1}</span>
        <span class="badge live">● LIVE</span>
      </div>
      <div class="players-line">${m.p1} <span class="vs">vs</span> ${m.p2}</div>
      <div style="margin-top:10px">
        ${Array(setsCount).fill(0).map((_,i)=>{
          const[a,b]=sets[i]||[null,null];
          const prevW1=calcSets(sets.slice(0,i)).w1,prevW2=calcSets(sets.slice(0,i)).w2;
          const dis=(prevW1>=winCount||prevW2>=winCount)||((w1>=winCount||w2>=winCount)&&a===null&&b===null);
          return`<div class="score-row">
            <span class="lbl r">第${i+1}セット</span>
            <input type="number" data-mid="${m.id}" data-set="${i}" data-side="0" value="${a!==null?a:''}" min="0" max="40" placeholder="-" ${dis?'disabled':''}>
            <span class="sep">-</span>
            <input type="number" data-mid="${m.id}" data-set="${i}" data-side="1" value="${b!==null?b:''}" min="0" max="40" placeholder="-" ${dis?'disabled':''}>
            <span class="lbl"></span>
          </div>`;
        }).join('')}
      </div>
      ${(w1>0||w2>0)?`<div class="total-row"><span class="total-score">${w1} - ${w2}</span>${finished?`<span class="winner-badge">${w1>w2?m.p1:m.p2} 勝利！</span>`:''}</div>`:''}
      ${finished?`<button class="confirm-btn" data-confirm="${m.id}">✔ 確定</button>`:''}
    </div>`;
  }
  html+=`</div>`;
  if(S.pendingPairs.length>0){
    const busy=busyPlayers();
    const next=S.pendingPairs.filter(p=>!busy.has(p.p1)&&!busy.has(p.p2));
    if(next.length>0)html+=`<div class="remaining-info">待機中の対戦: ${next.slice(0,3).map(p=>`${p.p1} vs ${p.p2}`).join(' / ')}${next.length>3?' など':''}（残り ${S.pendingPairs.length} 試合）</div>`;
    else html+=`<div class="remaining-info">残り ${S.pendingPairs.length} 試合（現在試合中の選手待ち）</div>`;
  }
  if(S.pendingPairs.length===0&&S.activeMatches.length===0){
    html+=`<div class="card" style="text-align:center;padding:24px"><div style="font-size:18px;font-weight:800;color:#e63000;margin-bottom:6px">🏆 全試合終了！</div><div style="color:#888;font-size:12px">リーグ表タブで最終結果をご確認ください</div></div>`;
  }
  return html;
}

function renderHistory(){
  if(!S.history.length)return`<div class="card"><div style="color:#888;text-align:center;padding:20px">まだ試合結果がありません</div></div>`;
  let html=`<div class="card"><div class="section-title">全試合結果</div>`;
  for(let i=S.history.length-1;i>=0;i--){
    const h=S.history[i];
    const r=calcSets(h.sets);
    const winCount=getWinCount();
    const finished=r.w1>=winCount||r.w2>=winCount;
    const winner=finished? (r.w1>r.w2?h.p1:h.p2):'未確定';
    const inEdit=!!S.editingHistory[h.id];
    const editSets=S.editingSets[h.id] || h.sets;
    const setsStr=h.sets.filter(([a,b])=>a!==null&&b!==null).map(([a,b])=>`${a}-${b}`).join('、');
    const setRows=inEdit?editSets.map((set,i)=>{
      const[a,b]=set||[null,null];
      return `<div style="display:flex;align-items:center;gap:8px;margin-top:8px"><span class="lbl" style="min-width:80px">第${i+1}セット</span><input type="number" data-hid="${h.id}" data-set="${i}" data-side="0" value="${a!==null?a:''}" min="0" max="40" style="width:72px"><span style="font-size:18px">-</span><input type="number" data-hid="${h.id}" data-set="${i}" data-side="1" value="${b!==null?b:''}" min="0" max="40" style="width:72px"></div>`;
    }).join(''):`<div class="history-sets">各セット: ${setsStr}</div>`;
    html+=`<div class="history-item" data-history="${h.id}">
      <div style="flex:1">
        <div style="font-weight:700">${h.p1} <span style="color:#e63000">${r.w1}-${r.w2}</span> ${h.p2}</div>
        ${setRows}
        <div style="margin-top:8px"><span class="table-label">${h.tableLabel}</span></div>
      </div>
      <div style="display:flex;flex-direction:column;gap:10px;align-items:flex-end">
        <span class="winner-badge">${winner}</span>
        ${inEdit?`<button class="ghost" data-cancel-history="${h.id}">キャンセル</button>`:`<button class="ghost" data-edit-history="${h.id}">編集</button>`}
        ${inEdit?`<button class="confirm-btn" data-save-history="${h.id}">保存</button>`:''}
      </div>
    </div>`;
  }
  return html+`</div>`;
}

function renderLeagueView(){
  const ps=S.players.filter(x=>x);
  const league=getLeague();
  const exportText=buildExportText();
  let html=`<div class="card"><div class="section-title">対戦マトリクス</div><div style="overflow-x:auto"><table><tr><th></th>`;
  for(const p of ps)html+=`<th>${p}</th>`;
  html+=`</tr>`;
  for(const p1 of ps){
    html+=`<tr><td style="font-weight:700;text-align:left;background:#f7f8fa;white-space:nowrap">${p1}</td>`;
    for(const p2 of ps){
      if(p1===p2){html+=`<td style="background:#f7f8fa">―</td>`;continue;}
      const h=S.history.find(h=>(h.p1===p1&&h.p2===p2)||(h.p1===p2&&h.p2===p1));
      if(!h){html+=`<td style="color:#ddd">未</td>`;continue;}
      const r=calcSets(h.sets);const[my,op]=h.p1===p1?[r.w1,r.w2]:[r.w2,r.w1];
      html+=`<td style="font-weight:700;color:${my>op?'#2a8a2a':'#cc2200'}">${my}-${op}</td>`;
    }
    html+=`</tr>`;
  }
  html+=`</table></div></div>`;
  html+=`<div class="card"><div class="section-title">順位表</div><table><tr><th>#</th><th style="text-align:left">選手</th><th>試合</th><th>勝</th><th>負</th><th>セット</th></tr>`;
  league.forEach((r,i)=>{
    const medal=i===0?'🥇':i===1?'🥈':i===2?'🥉':''
    const cls=i===0?'rank1':i===1?'rank2':i===2?'rank3':'';
    html+=`<tr class="${cls}"><td>${medal||i+1}</td><td style="text-align:left;font-weight:600">${r.p}</td><td style="color:#888">${r.w+r.l}</td><td style="color:#2a8a2a;font-weight:700">${r.w}</td><td style="color:#cc2200">${r.l}</td><td>${r.sw}-${r.sl}</td></tr>`;
  });
  html+=`</table></div>`;
  html+=`<div class="card"><div class="section-title">テキスト出力</div><button class="ghost" id="exportBtn" style="font-size:18px;padding:12px 18px">試合結果をテキスト出力</button>`;
  if(S.exportVisible){
    html+=`<textarea id="exportTextArea" readonly rows="10" style="width:100%;font-size:14px;padding:12px;margin-top:12px;white-space:pre-wrap;resize:vertical">${exportText}</textarea><button class="ghost" id="copyExportBtn" style="margin-top:12px;font-size:18px;padding:12px 18px">結果をコピー</button>`;
  }
  html+=`</div>`;
  return html;
}

function updateMatchCard(mid){
  const card=document.querySelector(`[data-card="${mid}"]`);
  if(!card)return;
  const m=S.activeMatches.find(x=>x.id===mid);
  if(!m)return;
  const sets=S.activeSets[mid]||emptySetsList();
  const{w1,w2}=calcSets(sets);
  const winCount=getWinCount();
  const finished=w1>=winCount||w2>=winCount;
  let totalRow=card.querySelector('.total-row');
  if(w1>0||w2>0){
    const html=`<span class="total-score">${w1} - ${w2}</span>${finished?`<span class="winner-badge">${w1>w2?m.p1:m.p2} 勝利！</span>`:''}`;
    if(totalRow){totalRow.innerHTML=html;}
    else{totalRow=document.createElement('div');totalRow.className='total-row';totalRow.innerHTML=html;card.appendChild(totalRow);}
  }
  let cb=card.querySelector('.confirm-btn');
  if(finished){
    if(!cb){cb=document.createElement('button');cb.className='confirm-btn';cb.dataset.confirm=mid;cb.textContent='✔ 確定';cb.addEventListener('click',()=>confirmMatch(mid));card.appendChild(cb);}
  } else {if(cb)cb.remove();}
  card.querySelectorAll('input[data-mid]').forEach(inp=>{
    const si=parseInt(inp.dataset.set),side=parseInt(inp.dataset.side);
    const[a,b]=sets[si]||[null,null];
    const prevW1=calcSets(sets.slice(0,si)).w1,prevW2=calcSets(sets.slice(0,si)).w2;
    const dis=(prevW1>=winCount||prevW2>=winCount)||((w1>=winCount||w2>=winCount)&&a===null&&b===null);
    if(document.activeElement!==inp){inp.value=(side===0?a:b)!==null?(side===0?a:b):'';}
    inp.disabled=dis;
  });
}

function attachEvents(){
  document.querySelectorAll('[data-tab]').forEach(el=>{el.onclick=()=>{S.view=el.dataset.tab;render();};});
  const tc=document.getElementById('tableCount');
  if(tc)tc.onchange=()=>{S.tables=Math.max(1,parseInt(tc.value)||1);};
  document.querySelectorAll('input[name=setCount]').forEach(radio=>{radio.onchange=()=>{S.setsCount=parseInt(radio.value)||5;}});
  document.querySelectorAll('[data-pi]').forEach(inp=>{inp.oninput=()=>{S.players[parseInt(inp.dataset.pi)]=inp.value;};});
  document.querySelectorAll('[data-rm]').forEach(btn=>{btn.onclick=()=>{const i=parseInt(btn.dataset.rm);S.players.splice(i,1);if(!S.players.length)S.players=[''];render();};});
  const ap=document.getElementById('addPlayer');
  if(ap)ap.onclick=()=>{S.players.push('');render();};
  const sl=document.getElementById('startLeague');
  if(sl)sl.onclick=()=>startLeague();
  const back=document.getElementById('backToSetup');
  if(back)back.onclick=()=>{S.phase='setup';S.view='matches';render();};
  document.querySelectorAll('input[data-mid]').forEach(inp=>{
    inp.oninput=()=>{
      const mid=inp.dataset.mid,si=parseInt(inp.dataset.set),side=parseInt(inp.dataset.side);
      if(!S.activeSets[mid])S.activeSets[mid]=emptySetsList();
      const raw=inp.value;
      if(raw===''){S.activeSets[mid][si][side]=null;updateMatchCard(mid);return;}
      const v=parseInt(raw);if(isNaN(v))return;
      S.activeSets[mid][si][side]=v;
      const other=1-side;
      if(v<=9)S.activeSets[mid][si][other]=11;
      else S.activeSets[mid][si][other]=v+2;
      updateMatchCard(mid);
    };
  });
  document.querySelectorAll('[data-confirm]').forEach(btn=>{
    btn.onclick=()=>confirmMatch(btn.dataset.confirm);
  });
  document.querySelectorAll('[data-edit-history]').forEach(btn=>{btn.onclick=()=>{startEditHistory(btn.dataset.editHistory);render();};});
  document.querySelectorAll('[data-cancel-history]').forEach(btn=>{btn.onclick=()=>{cancelEditHistory(btn.dataset.cancelHistory);render();};});
  document.querySelectorAll('[data-save-history]').forEach(btn=>{btn.onclick=()=>{saveHistoryEdit(btn.dataset.saveHistory);render();};});
  document.querySelectorAll('input[data-hid]').forEach(inp=>{
    inp.oninput=()=>{
      const id=inp.dataset.hid,si=parseInt(inp.dataset.set),side=parseInt(inp.dataset.side);
      if(!S.editingSets[id])return;
      const raw=inp.value;
      S.editingSets[id][si][side]=raw===''?null:parseInt(raw);
    };
  });
  const exportBtn=document.getElementById('exportBtn');
  if(exportBtn)exportBtn.onclick=()=>{S.exportVisible=!S.exportVisible;render();};
  const copyBtn=document.getElementById('copyExportBtn');
  if(copyBtn)copyBtn.onclick=()=>{
    const ta=document.getElementById('exportTextArea');
    if(!ta) return;
    ta.select();
    try{document.execCommand('copy');alert('テキストをコピーしました');}catch(e){alert('コピーに失敗しました');}
  };
}

render();
</script>
